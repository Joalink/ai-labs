name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      PINECODE_API_KEY: ${{secrets.PINECODE_API_KEY}}
      PINECODE_INDEX_NAME: ${{secrets.PINECODE_INDEX_NAME}}
      LLM_API_KEY: ${{secrets.LLM_API_KEY}}
      ASSEMBLYAI_API_KEY: ${{secrets.ASSEMBLYAI_API_KEY}}
      RECEIPT_DETECTION_API_URL: ${{secrets.RECEIPT_DETECTION_API_URL}}
      ENERGY_CONSUMPTION_API_URL: ${{secrets.ENERGY_CONSUMPTION_API_URL}}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check app tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
